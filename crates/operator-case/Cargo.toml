[package]
name = "operator-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的** operator 核心源码
# （`crates/protocol/src/operator/core.rs`）按 `include!` 编进宿主的测试靶里，
# 让树与七条原语的规矩在宿主上真跑一遍。
#
# 为什么要单独一个 crate（两条读数，都是实测）：
#
#   1) `protocol` 是 `[lib] test = false`：目标 riscv64gc-unknown-none-elf 上**编不出 libtest**
#      （libtest 依赖 std）⇒ 主工作区那几道门（`check --all-targets` / `build --release`）
#      一道都不编 `#[cfg(test)]` —— 那批用例长期只有"写着的规格"、没有"跑着的判据"。
#
#   2) **链接 `protocol` 也不行**：它依赖 `runtime`，而 `runtime/src/core/tls.rs` 里有两处
#      riscv 内联汇编（`mv tp, …`）⇒
#      `cargo test -p protocol --target x86_64-unknown-linux-gnu --tests`
#      死在 `invalid instruction mnemonic 'mv'`。
#      （**`cargo check` 在同一个目标上是过的**——它不做代码生成。这一格本身就是照实记：
#       "check 绿 ≠ 编得过"，判据要挑对那一档。）
#
# 故本 crate 与 `crates/alloc-probe` 走同一条路：**不进工作区**（根 `.cargo/config.toml` 把
# 主工作区钉在 riscv，宿主 crate 进不来）、**只依赖 `env`**、把核心源码**逐字未改**地
# `include!` 进来。那一台编的是内核分配器的源码，本台编的是树的源码。
#
# 门口：`scripts/host.sh`。

[dev-dependencies]
# 树用的名字 / 号 / 令牌都是 `env` 的类型；`include!` 进来的那份源码自己 `use env::…`。
# 放 `[dev-dependencies]`：本 crate 只有测试靶，没有 lib（`include!` 在测试靶里做）。
env = { path = "../env" }

[package]
name = "image"
version = "0.1.0"
edition = "2024"
publish = false

# image —— **造镜像那一步**：编程序（`programs` + `harness`）→ 打 initrd → 放到内核 ELF 旁。
#
# 它是**编外**的（根 `Cargo.toml` 的 `exclude`），与 `crates/gate` / `crates/protocol-case` 同源：
# 主工作区被 `.cargo/config.toml` 钉在 riscv 上，而这一步要 std + host ABI。
#
# 为什么要独立一件事、而不是留在 `kernel/build.rs`：见 `src/lib.rs` 头注（用户原话
# **"initrd 与 kernel 何干"**）。

[dependencies]
# 装配单（`assembly::ALL`）与清单格式（`wire::manifest`）——**两侧共读的那一份**就在 env。
env = { path = "../env" }

[[bin]]
name = "sqware-image"
path = "src/main.rs"

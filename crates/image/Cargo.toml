[package]
name = "image"
version = "0.1.0"
edition = "2024"
publish = false

# This is an excluded host workspace, including when its checkout is nested in
# another checkout (Delta worktrees). Do not inherit the enclosing target workspace.
[workspace]

# Published image-builder core: host library only. It knows explicit declarations,
# an explicit Deployment and explicit ImageBuild coordinates; it does not know the
# in-repo composition or a repository layout.

[dependencies]
# Host-safe declaration/type package: no execution, no server, no client, no composition.
env = { git = "https://github.com/shuyra-arche/env.git", rev = "d3000253cd5d13d466e91fafd4dbb27a5ec5aaae" }
unit = { git = "https://github.com/shuyra-arche/unit.git", rev = "90396f0fda376e0693fb1b9553aa21864d241057" }
system-api = { git = "https://github.com/shuyra-arche/system.git", rev = "9e5d63ca536a176583cf1b0054b4ecf7ddd88257" }
elf = { version = "0.8", default-features = false }
serde_json = "1"

[dev-dependencies]
# Composition is test data only (existing integration assertions); normal builds do not see it.
composition = { path = "../composition" }

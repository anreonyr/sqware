[package]
name = "image"
version = "0.1.0"
edition = "2024"
publish = false

# This is an excluded host workspace, including when its checkout is nested in
# another checkout (Delta worktrees). Do not inherit the enclosing target workspace.
[workspace]

# image —— **造镜像那一步**：编程序（`programs` + `harness`）→ 打 initrd → 放到内核 ELF 旁。
#
# 它是**编外**的（根 `Cargo.toml` 的 `exclude`），与 `crates/alloc-probe` 同源：
# 主工作区被 `.cargo/config.toml` 钉在 riscv 上，而这一步要 std + host ABI。
#
# 为什么要独立一件事、而不是留在 `kernel/build.rs`：见 `src/lib.rs` 头注（用户原话
# **"initrd 与 kernel 何干"**）。

[dependencies]
# **两侧共读的那一份**：清单格式（`env::manifest`，坐标与启动参数同理）＋ `ProgramKind`。
#
# **装配表不在依赖里**：它住 `programs/src/unit/catalog.rs`，由 `src/lib.rs` 用一行 `#[path]`
# 文本包含（那份声明只引 `env`，故宿主编得过）——见那边 `mod program;` 的头注。
env = { path = "../env" }

[[bin]]
name = "sqware-image"
path = "src/main.rs"

[package]
name = "supply-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**供单/回单那一门（`crates/protocol/src/driver/supply/call.rs`）
# 与它的失败域（`crates/protocol/src/driver/supply/core.rs`）按 `#[path]` 编进测试靶，
# 让"需求单怎么编、回单怎么解、条数与上限怎么算"这套规矩在宿主上真跑一遍。
#
# 与别的几台同一条路（清单与理由见 `scripts/host.sh` 头注；两条实测读数见
# `crates/operator-case` 的 `Cargo.toml`：`protocol` 是 `[lib] test = false`，而链接它会拖进
# `runtime` 的两处 riscv 内联汇编）。
#
# **照实记（这一份不用拆）**：它原先碰 `runtime` 的只有一行 `use runtime::core::port::{Access, Policy};`
# ——而那一处正是"上不了宿主"的成因。`Access`/`Policy` 按用户裁定搬进 `env`（与 `Permission`
# 同层，见 `crates/env/src/wire/access.rs`）之后，这一份**本来就全纯**，故与 `line` 那一份同形：
# **零切分**，直接编进来。
#
# 门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `Key` / `Name` / `PieToken` / `TaskId` / `Access` / `Policy` 都是 `env` 的类型；
# `#[path]` 进来的那两份源码自己 `use env::…`。
env = { path = "../env" }

[package]
name = "principal-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**身份核心（`crates/protocol/src/principal/core.rs`）
# 与**盟籍核心**（`crates/protocol/src/coalition/core.rs`）按 `#[path]` 编进测试靶，
# 让"名册与谱系"与"一张两列表"的规矩在宿主上真跑一遍。
#
# 为什么单独一个 crate（与另外三台同一条，理由与两条实测读数记在 `crates/operator-case`
# 的 `Cargo.toml`）：`protocol` 是 `[lib] test = false`（riscv 上编不出 libtest），而
# **链接 `protocol` 也不行**（它依赖 `runtime`，那里面两处 riscv 内联汇编在宿主上编不出来）。
# 故**不进工作区**（根 `Cargo.toml` 的 `exclude`）、把核心源码**逐字未改**地 `#[path]` 进来。
#
# **照实记（两本册子为什么同住一台）**：盟籍核心写着
# `use crate::principal::core::PrincipalId` —— 它要身份那本册子的号。放两台各编一遍的话，
# `principal/core.rs` 里那批判据会在两个测试靶里**各跑一遍**（`judge-case` 的头注记过同一条：
# "反过来把 judge.rs 引进 operator-case 会把上面这些再跑一遍"）。故同住一台，那批只跑一遍。
#
# **照实记（这一台是"把它们救活"的那一刀）**：这两份核心的 `#[cfg(test)]` 模块从写下那天
# 起**一次没跑过**——`protocol` 编不到、也没别的靶编它。门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `TaskId` 都是 `env` 的类型；`#[path]` 进来的那两份源码自己 `use env::…`。
env = { path = "../env" }

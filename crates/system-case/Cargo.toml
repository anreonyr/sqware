[package]
name = "system-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**编排那一层的三份核心按 `#[path]` 编进测试靶，
# 让它们真跑一遍：
#
#   `crates/protocol/src/system/desk.rs`   **账**（一张定长表：名字 / 身子 / 生命阶段 / 就绪凭据）
#   `crates/protocol/src/system/core.rs`   **判定**（纯函数：准不准起、起来了没有、还活着没有）
#   `crates/protocol/src/system/grant.rs`  **配给那一半**（把那段记录按步长解出来，第 i 条交给第 i 格）
#
# 与另外几台同一条路（理由与两条实测读数见 `crates/operator-case`：`protocol` 是
# `[lib] test = false`，而链接 `protocol` 会拖进 `runtime` 的两处 riscv 内联汇编）。
# 这一台**无桩**：那三份只认 `env`（`core.rs` 另认同层 `desk.rs` 的那几个类型）。
#
# 门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `Name` / `PieToken` / `TaskId` / `TeamId` / `Key` / `Pair` 都是 `env` 的类型；
# `#[path]` 进来的那几份源码自己 `use env::…`。
env = { path = "../env" }

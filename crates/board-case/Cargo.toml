[package]
name = "board-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**板核心（`crates/protocol/src/system/board/core.rs`）
# 按 `#[path]` 编进测试靶，让"公示板 + 待客台账"的规矩在宿主上真跑一遍。
#
# 与别的几台同一条路（清单与理由见 `scripts/host.sh` 头注；两条实测读数见
# `crates/operator-case` 的 `Cargo.toml`：
# `protocol` 是 `[lib] test = false`，而链接 `protocol` 会拖进 `runtime` 的两处 riscv 内联
# 汇编）。故**不进工作区**、逐字未改地 `#[path]` 进来。
#
# **照实记**：这一份的 `#[cfg(test)]` 模块同样从写下那天起**一次没跑过**。
# 这份核心只用 `env`，无桩。门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `Name` / `PieToken` / `TaskId` 都是 `env` 的类型；`#[path]` 进来的那一份自己 `use env::…`。
env = { path = "../env" }

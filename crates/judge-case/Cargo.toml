[package]
name = "judge-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**门禁三份源码按 `#[path]` 编进宿主的测试靶里 ——
# `judge.rs`（"这一位许不许"的定义）、`gate.rs`（裁决 → 线上那一格）、`ledger.rs`
# （那一格的规矩与归属记在哪），外加 `core.rs`（只为账要的那几个类型）——
# 让门外那一问与它那本账在宿主上真跑一遍。
#
# 为什么要单独一个 crate（与 `operator-case` / `line-case` 同一条理由，两条读数）：
#
#   1) `protocol` 是 `[lib] test = false`：目标 riscv64gc-unknown-none-elf 上**编不出 libtest**
#      （libtest 依赖 std）⇒ 主工作区那几道门（`check --all-targets` / `build --release`）
#      一道都不编它里面的 `#[cfg(test)]`——那批用例长期只有"写着的规格"、没有"跑着的判据"。
#
#   2) **链接 `protocol` 也不行**：它依赖 `runtime`，而 `runtime/src/core/tls.rs` 里有两处
#      riscv 内联汇编（`mv tp, …`）⇒ 宿主上 `invalid instruction mnemonic 'mv'`。
#
# 故走 `crates/alloc-probe` 那条现成的路：**不进工作区**（根 `.cargo/config.toml` 把主工作区
# 钉在 riscv，宿主 crate 进不来）、**只依赖 `env`**、把那一份判据源码**逐字未改**地 `#[path]` 进来。
#
# 本 crate 与 `operator-case` 是**两份判据**，不是一个台子的两半：那一台钉树的**结构**
# （七条原语、六格失败域），本台钉**门外那一问 + 那一本账**（三格裁决、两把钥匙、陈旧那一支）。
# 分开的理由是 `judge.rs` 与 `core.rs` 的纪律不同——前者不认识 `PrincipalId` / `CoalitionId`
# （两个号是泛型），后者不认识内核。
#
# **这一刀起它多编一份 `core.rs`**（照实记：挑过方向）。`ledger.rs` 的两把钥匙与失败域住在那
# 一份里，但那一份**没有** `#[cfg(test)]`（用例早搬去 `operator-case` 了）⇒ 引它不带进重复
# 用例；反过来把 `judge.rs` 引进 `operator-case` 会把门外那一问再跑一遍。
#
# 门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `TaskId` / `Name` / `PieToken` 都是 `env` 的类型；`#[path]` 进来的那几份源码
# 自己 `use env::…`。
env = { path = "../env" }

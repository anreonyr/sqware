[package]
name = "session-case"
version = "0.1.0"
edition = "2024"
publish = false

# 宿主（x86_64）专用 crate：把**真的**会话核心（`crates/protocol/src/session/core.rs`——
# 码头 / 泊位 / 认领那台机器）按 `#[path]` 编进测试靶，让"两个陌生实体怎么把会话的两端凑到
# 各自手里"这套规矩在宿主上真跑一遍。
#
# 为什么单独一个 crate（与另外五台同一条，理由与两条实测读数见 `crates/operator-case`）：
# `protocol` 是 `[lib] test = false`（riscv 上编不出 libtest），而链接 `protocol` 会拖进
# `runtime`。故**不进工作区**（根 `Cargo.toml` 的 `exclude`）、核心源码**逐字未改**地
# `#[path]` 进来。
#
# **照实记（这一台多一处桩，而且比 `line-case` 那处大）**：会话核心只跟运行时那一层说几句
# 话（`super::call`：铸孔 / 交出 / 放下 / 推 / 收 / 扫表 / 等 / 时钟），而那一层拖着 `runtime`。
# 故宿主靶里给它一个**桩**（`tests/session/call.rs`）：一张进程内的假表 + 一枚假钟。
# **桩量不了内核，量得了账**——这一台钉的就是那些**判据**（同名闸、两格判据、一枚孔只配一条
# 泊位、整批与失败域）。那九条"实测事实"（见 `crates/protocol/src/session/mod.rs`）里
# 能机械检查的部分，这里是它们的门。
#
# **照实记**：这一份核心原先**一条 `#[cfg(test)]` 都没有**（另外几份有、这里没有），
# 故这一台不是"救活"，是**新开**——规格写在靶子里（照 `crates/line-case` 的做法），
# 核心那份源码一个字不动，那份"逐字未改"因此仍是逐字未改。
#
# 门口：`scripts/host.sh`。

[dev-dependencies]
# 判据用的 `Mark` / `Name` / `PieToken` / `TaskId` 都是 `env` 的类型；`#[path]` 进来的
# 那一份源码自己 `use env::…`。
env = { path = "../env" }

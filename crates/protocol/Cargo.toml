[package]
name = "protocol"
version.workspace = true
edition.workspace = true

# `test = false`：**不是**"不该测"，是目标 `riscv64gc-unknown-none-elf` 上**编不出
# libtest**（libtest 依赖 std）。所以这一行**不翻**：翻过来，默认 riscv 目标上的
# `cargo check --all-targets` 会去编 libtest，编不出来，四道门一起塌。
#
# 宿主侧的用例**今天没有**（用户裁定"protocol-case 没必要"：那台编外宿主靶与 `crates/gate`
# 的 `host` 那一门都已删）。**也不能**在本 crate 里加集成测试：那要链接本 crate，
# 而本 crate 依赖 `runtime`，`runtime` 里那两处 riscv 内联汇编在宿主上编不过
# （`cargo test -p protocol --target x86_64-unknown-linux-gnu` ⇒
# `invalid instruction mnemonic 'mv'`；而 `cargo check` 同一个目标是过的——它不做代码生成）。
# ⇒ 这一层**今天一条判据都没有**。
# `bench`/`doctest` 同样关：无基准，文档示例都要真实硬件。
[lib]
test = false
bench = false
doctest = false

[dependencies]
env = { path = "../env" }
plan = { path = "../plan" }
# 「约」：不碰内核的那一半（形 / 据 / 账 / 不碰内核的适配）。本 crate 是「口」，见 `contract` 头注。
contract = { path = "../contract" }
# 协议的用户态实现要用**机制**（门闩 `HolePie`、回信通道 `Channel`）——机制在 runtime。
# 这条边就是"机制在运行时、语义在协议"的编译期形态（那条临时的边在这里翻正）。
runtime = { path = "../runtime" }
# 错误容器：客户端把协议负码包成 `erra::Error<EnvError>`（与 runtime 同款）。
erra = { version = "0.2.0", default-features = false }

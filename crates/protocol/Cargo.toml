[package]
name = "protocol"
version.workspace = true
edition.workspace = true

# `test = false`：**不是**"不该测"，是目标 `riscv64gc-unknown-none-elf` 上**编不出
# libtest**（libtest 依赖 std）。所以这一行**不翻**：翻过来，默认 riscv 目标上的
# `cargo check --all-targets` 会去编 libtest，编不出来，四道门一起塌。
#
# 宿主侧的用例**今天没有**：那台编外宿主靶与 `crates/gate` 的 `host` 那一门已删。
# **也不能**在本 crate 里加集成测试：那要链接本 crate，
# 而本 crate 依赖 `execution`，其中的 riscv 内联汇编在宿主上不能执行
# （`cargo test -p protocol --target x86_64-unknown-linux-gnu` ⇒
# `invalid instruction mnemonic 'mv'`；而 `cargo check` 同一个目标是过的——它不做代码生成）。
# ⇒ 这一层**今天一条判据都没有**。
# `bench`/`doctest` 同样关：无基准，文档示例都要真实硬件。
[lib]
test = false
bench = false
doctest = false

[dependencies]
env = { path = "../env" }
wire = { path = "../wire" }
system-api = { path = "../../programs/src/system/api" }
# 用户态通信依赖资源机制，执行支持用于客户端等待。
resource = { path = "../resource" }
execution = { path = "../execution" }
ipc = { path = "../ipc" }
# 客户端错误容器。
erra = { version = "0.2.0", default-features = false }

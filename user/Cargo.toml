[package]
name = "user"
version.workspace = true
edition.workspace = true

# 用户程序：freestanding、无 std、无 main crt。链接在 IMAGE_BASE (0x10000)、
# 静态 ET_EXEC；由内核 loader 按绝对 VMA 装载，_start 即 e_entry。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
ubi = { path = "../crates/ubi" }
erra = { version = "0.2.0", default-features = false }
# ANSI 转义序列解析器（纯 no_std）：Terminal 层解码键盘方向键/退格（行编辑）。
# default-features = false → 不带 utf8/codegen 特性，适配裸机 user 环境。
anstyle-parse = { version = "1.0.0", default-features = false }

[["bin"]]
name = "user-exiter"
path = "src/bin/exiter.rs"
test = false
bench = false
doctest = false


[package]
name = "user"
version.workspace = true
edition.workspace = true

# 用户程序：freestanding、无 std、无 main crt。链接在 USER_TEXT_BASE (0x10000)、
# 静态 ET_EXEC；由内核 loader 按绝对 VMA 装载，_start 即 e_entry。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
ubi = { path = "../crates/ubi" }

[["bin"]]
name = "user-exiter"
path = "src/bin/exiter.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "user-counter"
path = "src/bin/counter.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "user-yielder"
path = "src/bin/yielder.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "user-sleeper"
path = "src/bin/sleeper.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "user-threader"
path = "src/bin/threader.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "user-heaper"
path = "src/bin/heaper.rs"
test = false
bench = false
doctest = false

[[bin]]

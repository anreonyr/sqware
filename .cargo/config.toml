[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
# -Tlink.ld 移出全局 rustflags（kernel/user 各自 link.ld 不同），改由各 crate
# build.rs 经 cargo::rustc-link-arg 传绝对路径。relocation-model=static 对所有
# crate 生效（静态 ET_EXEC，loader 按绝对 VMA 装载——内核同样无 PIE，无害）。
rustflags = ["-Crelocation-model=static", "-Cforce-frame-pointers=yes", "-Ccode-model=medium"]
# cargo run 经 scripts/runner.nu 启动 QEMU（从 workspace 根执行）
runner = ["nu", "scripts/runner.nu"]

[alias]
# 造镜像那一步是**编外**的：它要 std + host ABI，而本工作区被上面那两行钉在
# riscv 上——**编内核之外**（用户裁定"initrd 与 kernel 何干"）：
#
#   cargo image               默认 root / release
#   cargo image rig debug     指定场景与档
#
# `cargo run` 只管编内核；交互式跑之前先来这一下（`scripts/runner.nu` 会查镜像在不在）。
image = "run --manifest-path crates/image/Cargo.toml --target x86_64-unknown-linux-gnu --"

# **照实记（用户裁定"去掉所有的测试 / 迁移到 embedded-test"）**：这里原有一条
# `gate` 别名，跑 `crates/gate` 那一台（9 扇 QEMU 门 + 装配单门 + `soak` 读数表）。
# 那一台连同别名整个删了。内核内用例现在这样跑：
#
#   nu scripts/qtest.nu --package kernel
#
# 它**不是 cargo 别名**——因为测试路的 QEMU 参数要从 `scripts/qemu-args.nu` 那张**唯一
# 出处**读出来（runner 自带的命令行与本仓的口径差 `-bios SBI.bin` / `-m 256M`），
# 而 cargo 别名做不了"读一张表再拼参数"。那一层转发见 `scripts/qtest.nu` 的头注。

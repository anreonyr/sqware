[package]
name = "programs"
version.workspace = true
edition.workspace = true

# 镜像里的各程序（今天二十一个）：freestanding、无 std、无 main crt。链接在 IMAGE_BASE
# (0x10000)、静态 ET_EXEC；由内核 loader 按绝对 VMA 装载，_start 即 e_entry。
# 内核 `build.rs::INITRD_BINS` 按 bin 名打进 initrd（**唯一**声明特权级处）。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
env = { path = "../crates/env" }
runtime = { path = "../crates/runtime" }
# 协议层：第一条协议操作出现了（root 用 `protocol::system` 的服务表起子域）。
protocol = { path = "../crates/protocol" }
# 设备树解析：**驱动自己读自描述**（内核不代劳，`platform/devices.rs` 只原样搬运）。
# 使用者目前只有 `prog-router`（要数自己的 context、列自己要接的线）。
fdt = { version = "0.1.5", default-features = false }
# 错误容器：`system::call` 把内核负码包成 `erra::Error<EnvError>`（与 protocol 同款）。
erra = { version = "0.2.0", default-features = false }


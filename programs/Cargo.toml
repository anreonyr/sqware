[package]
name = "programs"
version.workspace = true
edition.workspace = true

# 镜像里的**产品程序**（今天**六个** = 产品镜像那 6 条；测具那 22 台住隔壁的 `harness`）：freestanding、
# 无 std、无 main crt。链接在 IMAGE_BASE (0x10000)、静态 ET_EXEC；由内核 loader 按绝对 VMA
# 装载，_start 即 e_entry。
#
# `crates/image` 按 bin 名（约定 `prog-<名字>`）打进 initrd——**哪几台进哪张镜像**看
# `env::assembly::ALL` 每行的 `scenes`，而"装成哪种空间"（`ProgramKind`）看同一行的 `kind`。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
# `#[entry]`：入口那一手的过程宏（把 main 与汇编调的符号接上，见那个 crate 的头注）。
mold = { path = "../crates/mold" }
# **程序侧用例那一台**（用户裁定"服务台搬进 SUT"）：服务域把自己的判据就地登记成一例一例。
env = { path = "../crates/env" }
plan = { path = "../crates/plan" }
runtime = { path = "../crates/runtime" }
# 协议层：第一条协议操作出现了（root 用 `protocol::system` 的服务表起子域）。
protocol = { path = "../crates/protocol" }
# 「约」：不碰内核的那一半。取它有两处——码表宏（`contract::fail_codes!`）与报文那一条约定
# （`contract::message::Message`：rtc 那一族的答那两形要上船台）。驱动自己的协议住本 crate。
contract = { path = "../crates/contract" }
# 设备树解析：**驱动自己读自描述**（内核不代劳，`platform/devices.rs` 只原样搬运）。
# 使用者目前只有 `prog-router`（要数自己的 context、列自己要接的线）。
fdt = { version = "0.1.5", default-features = false }
# 错误容器：`system::server` 把内核负码包成 `erra::Error<EnvError>`（与 protocol 同款）。
erra = { version = "0.2.0", default-features = false }

[[bin]]
name = "prog-echo"
path = "src/user/echo.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-router"
path = "src/driver/router/main.rs"
test = false
bench = false
doctest = false

# 串口驱动（同一族：驱动整块住 src/driver/）：持有 serial@10000000，开"收到字节就拉线"。
[[bin]]
name = "prog-uart"
path = "src/driver/uart/main.rs"
test = false
bench = false
doctest = false

# 第二台设备驱动（同一族）：持有 rtc@101000（11 号线），兼报时服务（门牌 `/device/rtc`）。
[[bin]]
name = "prog-rtc"
path = "src/driver/rtc/main.rs"
test = false
bench = false
doctest = false

# 编排域（S 态，独立域）：起整批服务、监督、把入口挂上树；配给从引导域领。
[[bin]]
name = "prog-system"
path = "src/system/main.rs"
test = false
bench = false
doctest = false

# 引导域（S 态，boot 引入的唯一顶层域）：读 boot 的两块账、把持树者与编排者起起来，
# 之后只做一件事——照单发货。
[[bin]]
name = "prog-root"
path = "src/root/main.rs"
test = false
bench = false
doctest = false

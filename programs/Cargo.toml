[package]
name = "programs"
version.workspace = true
edition.workspace = true

# 镜像里的**产品程序**（今天**十五个**；测具那 16 台住隔壁的 `harness`）：freestanding、
# 无 std、无 main crt。链接在 IMAGE_BASE (0x10000)、静态 ET_EXEC；由内核 loader 按绝对 VMA
# 装载，_start 即 e_entry。
#
# 内核 `build.rs` 按 bin 名打进 initrd——**哪几台进哪张镜像按场景选表**（`PRODUCTS` /
# `PROBES` / `RIGS` + `bins_for`），而"装成哪种空间"（`ProgramKind`）也**只在那里声明**。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
env = { path = "../crates/env" }
runtime = { path = "../crates/runtime" }
# 协议层：第一条协议操作出现了（root 用 `protocol::system` 的服务表起子域）。
protocol = { path = "../crates/protocol" }
# 设备树解析：**驱动自己读自描述**（内核不代劳，`platform/devices.rs` 只原样搬运）。
# 使用者目前只有 `prog-router`（要数自己的 context、列自己要接的线）。
fdt = { version = "0.1.5", default-features = false }
# 错误容器：`system::call` 把内核负码包成 `erra::Error<EnvError>`（与 protocol 同款）。
erra = { version = "0.2.0", default-features = false }

[[bin]]
name = "prog-echo"
path = "src/user/echo.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-guest"
path = "src/user/guest.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-passer"
path = "src/user/passer.rs"
test = false
bench = false
doctest = false

# 房客（U 态，同 `passer` 一档）：占一条线、**直接死**——线路由者那本账的探活读数。
[[bin]]
name = "prog-lodger"
path = "src/user/lodger/main.rs"
test = false
bench = false
doctest = false

# 客人（U 态）：`/device/rtc` 那面服务的第一位用家——问时间、约一个时刻、等到那一声。
[[bin]]
name = "prog-sleeper"
path = "src/user/sleeper.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-router"
path = "src/driver/router/main.rs"
test = false
bench = false
doctest = false

# 串口驱动（同一族：驱动整块住 src/driver/）：持有 serial@10000000，开"收到字节就拉线"。
[[bin]]
name = "prog-uart"
path = "src/driver/uart/main.rs"
test = false
bench = false
doctest = false

# 第二台设备驱动（同一族）：持有 rtc@101000（11 号线），兼报时服务（门牌 `/device/rtc`）。
[[bin]]
name = "prog-rtc"
path = "src/driver/rtc/main.rs"
test = false
bench = false
doctest = false

# 身份服务（U 态，独立域，一枚线程）：名册 + 谱系两张表，招待所有客人（门牌 `/sys/principal`）。
[[bin]]
name = "prog-principal"
path = "src/supervisor/principal/main.rs"
test = false
bench = false
doctest = false

# 主体（U 态）：身份服务的第一位真客人——问自己是谁，把六条读数打出来。
[[bin]]
name = "prog-subject"
path = "src/user/subject.rs"
test = false
bench = false
doctest = false

# 结盟服务（U 态，独立域，一枚线程）：横向那张盟籍表（门牌 `/sys/coalition`）；它是身份服务
# 的客人——每条写原语嵌一次 `Resolve(发送者)`。
[[bin]]
name = "prog-coalition"
path = "src/supervisor/coalition/main.rs"
test = false
bench = false
doctest = false

# 盟友（U 态）：结盟服务的第一位真客人——立两枚盟、进进出出、验幂等与第三态。
[[bin]]
name = "prog-member"
path = "src/user/member.rs"
test = false
bench = false
doctest = false

# 命名树的服务（U 态，独立域，一枚线程）：起那棵树、招待所有客人；接树归编排域。
[[bin]]
name = "prog-operator"
path = "src/supervisor/operator/main.rs"
test = false
bench = false
doctest = false

# 编排域（S 态，独立域）：起整批服务、监督、把入口挂上树；配给从引导域领。
[[bin]]
name = "prog-system"
path = "src/supervisor/system/main.rs"
test = false
bench = false
doctest = false

# 引导域（S 态，boot 引入的唯一顶层域）：读 boot 的两块账、把持树者与编排者起起来，
# 之后只做一件事——照单发货。
[[bin]]
name = "prog-root"
path = "src/supervisor/root/main.rs"
test = false
bench = false
doctest = false
# 场景旗标 `sqware_fair` 由 `kernel/build.rs` 传给嵌套 cargo（见该文件里那条照实记）；
# 而**直连工作区**编译 `programs`（`cargo check --workspace --all-targets`）时没人传 ⇒ 在这里
# 声明它的存在，免得吃一条 `unexpected_cfgs` 的警告。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sqware_fair)'] }

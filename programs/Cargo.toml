[package]
name = "programs"
version.workspace = true
edition.workspace = true

# 镜像里的**产品程序**（今天**九个** bin = 产品景那 9 条；测具住隔壁的 `harness`）：freestanding、
# 无 std、无 main crt。链接在 IMAGE_BASE (0x10000)、静态 ET_EXEC；由内核 loader 按绝对 VMA
# 装载，_start 即 e_entry。
#
# `crates/image` 按 bin 名（约定 `prog-<名字>`）打进 initrd——**哪几台进哪张镜像**看
# `programs/src/unit/catalog.rs` 的 `PROGRAMS` 每行的 `wanted_by`，而"装成哪种空间"（`ProgramKind`）
# 看同一行的 `space`；**哪一台是引导镜像**看 `entry`。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
# `#[entry]`：入口那一手的过程宏（把 main 与汇编调的符号接上，见那个 crate 的头注）。
mold = { path = "../crates/mold" }
# 服务域把判据就地登记成一例一例（自己挂到自己的 `cases::Suite` 上）。
env = { path = "../crates/env" }
runtime = { path = "../crates/runtime" }
# 协议层：**协议定义的唯一来源**。取它有三处——
# 服务表（`protocol::system`）、码表宏（`protocol::fail_codes!`）与报文那一条约定
# （`protocol::message::Message`：rtc 那一族的答那两形要上船台）。驱动自己的协议住本 crate。
protocol = { path = "../crates/protocol" }
# 设备树解析：**驱动自己读自描述**（内核不代劳，`platform/devices.rs` 只原样搬运）。
# 使用者目前只有 `prog-router`（要数自己的 context、列自己要接的线）。
fdt = { version = "0.1.5", default-features = false }
# 错误容器：`system::server` 把内核负码包成 `erra::Error<EnvError>`（与 protocol 同款）。
erra = { version = "0.2.0", default-features = false }

[[bin]]
name = "prog-canonical"
path = "src/user/canonical/main.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-router"
path = "src/driver/router/main.rs"
test = false
bench = false
doctest = false

# 串口驱动（同一族：驱动整块住 src/driver/）：持有 serial@10000000，开"收到字节就拉线"。
[[bin]]
name = "prog-uart"
path = "src/driver/uart/main.rs"
test = false
bench = false
doctest = false

# 第二台设备驱动（同一族）：持有 rtc@101000（11 号线），兼报时服务（门牌 `/device/rtc`）。
[[bin]]
name = "prog-rtc"
path = "src/driver/rtc/main.rs"
test = false
bench = false
doctest = false

# 编排域（S 态，顶层域——**它也是这一景的引导镜像**）：自己读 boot 的两块账、持全机门闩，
# 起整批服务、监督、把入口挂上树、按坐标把门闩授给客人。
[[bin]]
name = "prog-system"
path = "src/system/main.rs"
test = false
bench = false
doctest = false

# 三枚常驻服务（**U 态，各自一个域**）：持树者 / 名册（身份）/ 盟册（结盟）。它们由编排域
# 用与其他每一台相同的 `mint` 路起起来——不再与编排者共用一份字节，也没有 `Role` 那层分派。
# 起手位次 0/1/2（持树者第一、名册第二、盟册第三），与 iii 之前逐字相同。
[[bin]]
name = "prog-operator"
path = "src/service/operator/main.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-principal"
path = "src/service/principal/main.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-coalition"
path = "src/service/coalition/main.rs"
test = false
bench = false
doctest = false

# 设备账（U 态，独立域）：收整机物料、立账、落 `/svc/hub` 与 `/dev/<类>/<名>`、答三面
# （报名 / 列册 / 认领）。起手位次 3（驱动之前——驱动起手第一件事是向它认领）。
[[bin]]
name = "prog-hub"
path = "src/service/hub/main.rs"
test = false
bench = false
doctest = false


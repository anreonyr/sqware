[package]
name = "shuyra-image"
version = "0.1.0"
edition = "2024"
publish = false

# Integration-owned adapter: chooses the in-repo scene/profile, resolves the
# Integration build root, and calls the published image-builder core.
[workspace]

[dependencies]
image = { package = "image-builder", git = "https://github.com/shuyra-arche/image-builder.git", rev = "17f294bae58ef5526a18fd6a88a88cc41850d4a6" }
composition = { path = "../../crates/composition" }
unit = { git = "https://github.com/shuyra-arche/unit.git", rev = "90396f0fda376e0693fb1b9553aa21864d241057" }

[[bin]]
name = "shuyra-image"
path = "src/main.rs"

# Integration tests: the Source composition cases and the catalog cases.
[dev-dependencies]
env = { git = "https://github.com/shuyra-arche/env.git", rev = "d3000253cd5d13d466e91fafd4dbb27a5ec5aaae" }
system-support = { git = "https://github.com/shuyra-arche/system.git", rev = "5a792ff2d39901a970925b1a6d63206adf6c16d8" }

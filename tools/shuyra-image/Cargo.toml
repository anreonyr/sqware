[package]
name = "shuyra-image"
version = "0.1.0"
edition = "2024"
publish = false

# Integration-owned adapter: chooses the in-repo scene/profile, resolves the
# Integration build root, and calls the published image-builder core.
[workspace]

[dependencies]
image = { path = "../../crates/image" }
composition = { path = "../../crates/composition" }
unit = { git = "https://github.com/shuyra-arche/unit.git", rev = "90396f0fda376e0693fb1b9553aa21864d241057" }

[[bin]]
name = "shuyra-image"
path = "src/main.rs"

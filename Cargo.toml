[workspace]
# `crates/alloc-probe` 是**宿主**（x86_64）侧的分配器压测台：主工作区被
# `.cargo/config.toml` 钉在 `riscv64gc-unknown-none-elf` 上，它进不来（要 std + host ABI）。
# 它自带 Cargo.toml 与 README，用 `crates/alloc-probe/.cargo/config.toml` 里那十条别名跑。
exclude = [
    "crates/alloc-probe",
    # `crates/image` 是**造镜像那一步**（用户裁定"initrd 与 kernel 何干"）：与上面那台同源，
    # 要 std + host ABI。跑法见 `.cargo/config.toml` 的 `[alias] image`。
    "crates/image",
]

# 没有 `[profile.framework]` / `[profile.harden]`：护栏（`debug_assertions` 全集：
# lockdep / 页表 / 空间不变量）一直在 release 档开着，没有专门的测试档去重新开它。

# **测具**那一档（探针 / 试客 / 压测台）住 `programs` 那一份 crate 里（`programs/src/harness/`）：
# 同一张链接脚本、同一批"被内核装载的 ELF"、同一手 `programs::entry`；哪几台进哪张镜像只在
# `programs/src/unit/` 声明（**程序装配声明的唯一来源**）。
members = [
    "kernel",
    "programs",
    "crates/env",
    "crates/protocol",
    "crates/resource",
    "crates/execution",
    "crates/schedule",
    "crates/sbi",
    "crates/mold",
    "crates/wire",
    "crates/ipc",
    "crates/system-client",
    "programs/src/system/api",
]
default-members = ["kernel"]
resolver = "3"

# ── 排版口径（**明文声明**，用户裁定：本仓手排、`cargo fmt` 不是判据）──────────────
#
# **不跑 `cargo fmt --all`**：它在这棵树上一直是红的。实测（2026-10-01）**107 处、71 个文件**
# （`cargo fmt --all --check` 打出的 `Diff in <file>:<line>` 逐条数；全树 403 份被跟踪的 `.rs`
# 里其余是干净的）。故 **fmt 绿不是任何一关的判据**，`cargo fmt --all --check` 的读数只当参考。
#
#   · 改哪一段，就照**那一段**的排法写（邻行即规格；新文件按同目录的排法起手）；
#   · **不许为了让它变绿而全树重排**——那些处里没有一处改变判据，而重排会把成对的对齐、
#     与代码对齐的注释一起打散。需要单独钉住的表写 `#[rustfmt::skip]`
#     （例见 `programs/src/unit/catalog.rs` 的 `PROGRAMS` 那张表），不是"跑一遍 fmt 再从 diff 里补回来"。

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = true
panic = "abort"

# - `framework` 档的全部用途是"让内核内用例跑在与验收门同一套护栏下"，而
#   `--features framework` 那个 feature 已随自研框架一起删（见 `kernel/Cargo.toml`）；
# - `harden` 没有别的消费者（只被 framework 继承）。
#
# 护栏本身——`debug_assertions` 开着的 lockdep 全集、页码表/空间不变量——**一个字没动**：
# 它照旧在 `[profile.dev]` 与任何显式 `debug-assertions = true` 的档里生效。

[profile.release]
# opt-level=2 的取舍：这套值没有重新量过"换档会不会再犯别的错"，
# 故不擅自改（`WakeKey` 已是枚举、没有位打包也就没有 mask——这条约束今天不成立）。

[workspace]
# `crates/alloc-probe` 是**宿主**（x86_64）侧的分配器压测台：主工作区被
# `.cargo/config.toml` 钉在 `riscv64gc-unknown-none-elf` 上，它进不来（要 std + host ABI）。
# 它自带 Cargo.toml 与 README，用 `crates/alloc-probe/.cargo/config.toml` 里那十条别名跑。
#
# `crates/protocol-case` 是**同一类**的宿主台：把 `protocol` 的**八处纯核心**逐字 `#[path]`
# 进来，让它们的规矩在宿主上真跑一遍（门口是 `crates/gate` 的 `host` 那一门；八个靶与那张
# 清单住那个 crate 的 `Cargo.toml` 头注）。它进不来的理由与上一条同源，外加一条实测：链接 `protocol` 会带进
# `runtime`，而 `runtime` 里那两处 riscv 内联汇编在宿主上编不过。
#
# **照实记（用户裁定）**：这一台原先**是八台**——`operator-case` / `line-case` / `judge-case` /
# `principal-case` / `board-case` / `session-case` / `system-case` / `supply-case`，八份
# `Cargo.toml` + 八份 `Cargo.lock` + 八个 `target/`，而 `env` 被编了八遍。用户的话是
# **"我希望测试和运行环境分开，而不是交叉在一起"**，故收成一处：一个 crate、八个靶
# （靶名 = 原来的 crate 名去后缀）。
exclude = [
    "crates/alloc-probe",
    "crates/protocol-case",
    # `crates/gate` 是**门**那一台（用户裁定"完全消除测试脚本"）：台（起机 / 跑宿主命令）+
    # 判据（含起 QEMU 的那几门）。它进不来的理由与上面两台同源（要 std + host ABI），跑法见
    # `.cargo/config.toml` 的 `[alias] gate`。
    "crates/gate",
    # `crates/image` 是**造镜像那一步**（用户裁定"initrd 与 kernel 何干"）：与上面两台同源，
    # 要 std + host ABI。跑法见 `.cargo/config.toml` 的 `[alias] image`。
    "crates/image",
]
# `harness` 是**工作区成员**，与 `programs` 同一族（同一张链接脚本、同一批"被内核装载的
# ELF"）：它是**测具**那一档——探针（进验收镜像当客人）与压测台（整台替换引导镜像）。
# 搬家那一刀的缘由、以及"哪几台进哪张镜像"，见 `harness/Cargo.toml` 与
# `crates/env/src/assembly.rs`（装配单那一张表）。
members = [
    "kernel",
    "programs",
    "harness",
    # **程序侧用例那一台**（用户裁定"服务台搬进 SUT"）：`programs` 与 `harness` 都要用它，
    # 而 `harness` 依赖 `programs` ⇒ 它不能住在任何一边（成环）。见 `crates/cases/Cargo.toml`。
    "crates/cases",
    "crates/env",
    "crates/contract",
    "crates/protocol",
    "crates/runtime",
    "crates/sbi",
    "crates/envmacros",
    "crates/entry-macro",
]
default-members = ["kernel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = true
panic = "abort"

# 验收门的 harden 档：**继承 release，只把断言打开**——`debug_assertions` 在 release 里是关的，
# 而门的构建只有 `--release` ⇒ 容器⇔状态不变量与整条 lockdep 校验（`lock/depend.rs` 全文件
# `#[cfg(debug_assertions)]`）在门跑过的每个产物里都被编译掉了（实测：release ELF 里
# 「装槽前 running 必须为空」「new level must exceed max(held)」各 0 次，debug ELF 里各 1 次）。
# 只多开这一个开关，opt-level 与 debug 与 release 一致 ⇒ 行为可比。
[profile.harden]
inherits = "release"
debug-assertions = true

# 框架档（内核内测试）：**继承 harden**，于是用例与自检跑在与验收门同一套护栏下 ——
# debug_assertions 开着（页码表/空间不变量、lockdep 全集在场），`--features framework`
# 再叠上用例与**自检**（挂起自检 / 帧范围 / 簿记↔页表；见 `kernel/Cargo.toml` 的门注）。
# 用例要测的正是这些护栏，关着断言跑测试等于测了个空壳。
#
# 注：`--features framework` 是**内核 crate 的 feature**，profile 只管构建参数，
# 两者要一起给（`cargo build --profile framework --features framework`）。
[profile.framework]
inherits = "harden"
debug-assertions = true

[profile.release]
# opt-level=2 是**历史取值**：旧 `WaitKey::compose` 时代（位打包 + mask）在更高优化档
# 下 mask 计算会被 size 优化多算一次 +1（错联到 0x1000000000000）；当时抽过一个
# `#[inline(never)]` 的 mask helper（`low48`）并端到端跑通 5/5，故钉在 2。
# **那套东西已经不存在**：`WakeKey` 改成枚举、没有位打包也就没有 mask（见
# `kernel/src/work/room/messenger/wait/site.rs` 头注），`low48` 随它一起删了。
# 今天仍留 2 是照实取舍：没有重新量过"换档会不会再犯别的错"，不擅自改。

[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
default = ["semihosting"]
# trace 结构化事件经 semihosting fs 导出宿主文件（JSON Lines，自描述长度；文件
# sqware-trace.jsonl 落在 qemu CWD，runner 归档）。**默认开启**（default 引入）——
# 要关则把 default 里的 semihosting 拿掉。依赖 QEMU -semihosting（runner 恒加）。
semihosting = []

# opt-in：完整性/审计框架（Banker/Ledger/poison/audit/基线断言——见 memory::integrity）。
# 需 debug 构建且 --features audit 同时满足才生效（all(debug_assertions, feature="audit")）；
# release 或未开 feature 均编译为空、零开销。
audit = []

[dependencies]
ubi = { path = "../crates/ubi" }
sbi = { path = "../crates/sbi" }
table = { path = "../crates/table" }

bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }
fdt = { version = "0.1.5", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "alloc",
  "default-hasher",
] }
log = { version = "0.4.33" }
riscv = { version = "0.16.1", features = ["s-mode"] }
riscv-rt = { version = "0.18.0", features = ["s-mode"] }
# semihosting 通道（semihosting 导出）：fs=写宿主导出文件（唯一必需）。
# 未开 stdio（每行 open ":tt" 过重）、panic-handler（与内核自带 handler 冲突）、
# time/args（本次不需要）。所有 API 均 no_std、零分配。
semihosting = { version = "0.1.25", features = ["fs"] }

[[bin]]
name = "sqware"
path = "src/main.rs"
test = false
bench = false
doctest = false

[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
default = []
# diagnose 结构化记录经 semihosting fs 导出宿主文件（JSON Lines，自描述长度；文件
# sqware-diagnose.jsonl 落在 qemu CWD，runner 归档）。**非默认**（`default = []`，
# 要开须显式 `--features semihosting`）——旧注写「默认开启（default 引入）」与
# manifest 相反。另注意 qemu 侧的 `-semihosting` 只在 `QEMU_SEMI=1` / `QEMU_FEATURES`
# 含 semihosting 时才加（`scripts/qemu-args.nu`，**只管 QEMU 侧**），而造镜像与测试路
# 都不带这个头文件 feature ⇒ 那些产物没有结构化导出。
# 要有结构化导出就必须有 `serde_json` ⇒ 那一格是**可选依赖**（`dep:` 语法）。不是洁癖：
# cargo 的 `unused_dependencies` 看不见 `cfg(feature = "semihosting")` 里的用法，依赖写成
# 必选就永远挂着一条**假警告**（本笔之前正是如此）。
semihosting = ["dep:serde_json"]
# **照实记（用户裁定"去掉所有的测试 / 迁移到 embedded-test"）**：这里原先有一格
# `framework = []`——自研的内核内测试框架：`.tests` 段登记 + 逐例打点，**外加**它顺带
# 管着的自检数据源（挂起自检 / 帧取还范围 / 簿记↔页表，见 `weak.rs`、`statistics.rs`、
# `space/*` 里那些 `cfg`）。
#
# 拆法：**登记与打点**搬去 `embedded-test`（`tests/embedded.rs` + `nu scripts/qtest.nu`）；
# 那些 `cfg(any(debug_assertions, feature = "framework"))` 全部收成 `cfg(debug_assertions)`
# ——**自检并进断言那一档**，它本来就只在 debug 里有实体。故这一格没有读者，删。

[lib]
path = "src/lib.rs"
# **与 `protocol` / `contract` 同款，理由同**：riscv 目标上编不出 libtest（它要 std）。
# `cargo test` 会把 lib 也编成一个测试目标 ⇒ 不关就是 `E0463: can't find crate for test`。
# 关掉的是"lib 自身当测试目标"，**不影响** `[[test]] embedded`（集成测试是另一个目标）。
test = false
bench = false
doctest = false

# **这里原先有一格 `[build-dependencies] env`**（照实记）：那时 `build.rs` 自己打 initrd、
# 读清单格式。②③④ 搬去 `crates/image` 之后（见 `build.rs` 头注），本脚本只剩"把链接脚本
# 交给 rustc"，故那一格**没有读者**——内核读 initrd 是**开机时**的事
# （`src/platform/initrd.rs`），那归下面的 `[dependencies]`，不归构建脚本。本笔删掉它。
[dependencies]
# 提供 `embedded-test.x`（`cargo-qtest` 自己会加 `-Tembedded-test.x`，本格供出那个 `-L`）。
#
# **照实记（为什么它在 `[dependencies]` 而不是 dev）**：实测过放 dev 的版本——`-L` **传不到
# bin 的链接**（bin 不是测试目标，dev 依赖不在它的图里），而 `cargo-qtest` 的
# `-Tembedded-test.x` 是加给**整次构建**的（bin 也吃）⇒ `rust-lld: cannot find linker
# script embedded-test.x`。上游 README 也是这么写的：它那片脚本必须住 `[dependencies]`。
#
# **照实记（它那条 `unused dependency` 警告消不掉，且不 suppress）**：这个 crate
# `autolib = false`、没有一行 Rust 用法（只靠 `links` ＋ 构建脚本给出那个 `-L`）⇒ cargo 的
# `unused_dependencies` 永远报它。**留一条假警告**比把这条 lint 整片关掉划算——关掉会把
# 真阳性（本笔刚删掉的那两条）一起藏起来。
embedded-test-linker-script = "0.1"

env = { path = "../crates/env" }
plan = { path = "../crates/plan" }
sbi = { path = "../crates/sbi" }
stanza = "0.5.2"

bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }
fdt = { version = "0.1.5", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "alloc",
  "default-hasher",
] }
log = { version = "0.4.33" }
riscv = { version = "0.16.1", features = ["s-mode"] }
# **照实记（清尾账时删掉两条没有读者的依赖）**：`riscv-rt` 与 `rustc-demangle` **全仓零
# 引用**（`grep -rn` 过，注释之外一处都没有）——入口 `_start` 与链接脚本都是本仓自己的
# （`src/main.rs` 的 `global_asm!` ＋ `kernel/link.x`），那条 demangle 注释说的"scene 转储
# 打印"也没有代码用它。故两格删掉。
# 诊断报告序列化（整档 + 事件流）：serde_json 承担 JSON，derive 即形状、零手写序列化器。
# **可选**：只有 `feature = "semihosting"` 那条导出路用得到它（见上面那格 feature）。
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
# semihosting = 导宿主文件用的 crate；只开 fs（stdio/panic-handler/time/args 均不需要）。
semihosting = { version = "0.1.25", features = ["fs"] }

[[bin]]
name = "sqware"
path = "src/main.rs"
test = false
bench = false
doctest = false

# 内核内用例的登记与逐例打点（`embedded-test`）。
# `harness = false`：我们不要 libtest，要 embedded-test 自己那套 runner 协议。
[[test]]
name = "embedded"
path = "tests/embedded.rs"
harness = false

[dev-dependencies]
# **dev，不是 dependencies**——这一格是有讲究的：普通构建里 embedded-test 根本不在场，
# 于是 `src/main.rs` 那个 `#[no_mangle] fn main` 与它导出的 `#[export_name = "main"]`
# **永不同框**（测试目标不链 bin：`[[bin]] test = false`）。
#
# `default-features = false`：默认那套带 `panic-handler`，它会定义 `#[panic_handler]`，
# 与内核自己那一个（`runtime::diagnose::halt`）直接撞。取 `semihosting` 是因为
# `embedded-test` 的 `hosting` 模块**必须**有一个传输实现（std / semihosting 二选一）。
embedded-test = { version = "0.7", default-features = false, features = ["semihosting"] }

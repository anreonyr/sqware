[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
default = []
# diagnose 结构化记录经 semihosting fs 导出宿主文件（JSON Lines，自描述长度；文件
# sqware-diagnose.jsonl 落在 qemu CWD，runner 归档）。**非默认**（`default = []`，
# 要开须显式 `--features semihosting`）。另注意 qemu 侧的 `-semihosting` 只在
# `QEMU_SEMI=1` / `QEMU_FEATURES` 含 semihosting 时才加（`scripts/qemu-args.nu`，
# **只管 QEMU 侧**），而造镜像与测试路都不带这个头文件 feature ⇒ 那些产物没有结构化导出。
# 要有结构化导出就必须有 `serde_json` ⇒ 那一格是**可选依赖**（`dep:` 语法）。不是洁癖：
# cargo 的 `unused_dependencies` 看不见 `cfg(feature = "semihosting")` 里的用法，
# 依赖写成必选就永远挂着一条假警告。
semihosting = ["dep:serde_json"]
# 拆法：**登记与打点**搬去 `embedded-test`（`tests/embedded.rs` + `nu scripts/qtest.nu`）；
# 那些 `cfg(any(debug_assertions, feature = "framework"))` 全部收成 `cfg(debug_assertions)`
# ——**自检并进断言那一档**，它本来就只在 debug 里有实体。故这一格没有读者，删。

[lib]
path = "src/lib.rs"
# **与 `protocol` 同款，理由同**：riscv 目标上编不出 libtest（它要 std）。
# `cargo test` 会把 lib 也编成一个测试目标 ⇒ 不关就是 `E0463: can't find crate for test`。
# 关掉的是"lib 自身当测试目标"，**不影响** `[[test]] embedded`（集成测试是另一个目标）。
test = false
bench = false
doctest = false

[dependencies]
# 提供 `embedded-test.x`：本 crate 的 `build.rs` 把它的**源文件**（`links` 那一格保证它在
# registry 里可读）读出来、落到自己的 `OUT_DIR`，再用 `cargo::rustc-link-arg-tests` 的
# **绝对路径**交给 `[[test]] embedded`（`cargo::rustc-link-arg` 只作用于 bin，交不到测试目标）。
#
# **（为什么它在 `[dependencies]` 而不是 dev）**：`-L` 那条搜索路径（上游构建脚本发的
# `cargo:rustc-link-search`）**传不到 bin 的链接**（bin 不是测试目标，dev 依赖不在它的图里），
# 而这条路径在测试构建里要跟着走 ⇒ 它必须住 `[dependencies]`（走 dev 的版本实测红过）。
#
# **（`cargo-qtest` 那条注入为什么指望不上）**：`cargo-qemu-test` 对 riscv 有
# "manifest 目录里已经有 `.x` ⇒ 认为你有自己的脚本、不再注入"的分支——`kernel/link.x` 正好命中
# ⇒ 它**两枚都不注入**；而上游这枚的构建脚本只发 `rustc-link-search`、**不发 `DEP_…_LINK`**
# ⇒ 由本 crate 的 `build.rs` 自己交代那枚脚本（读源文件 + 哈希自检，见它的头注）。
embedded-test-linker-script = "0.1"

env = { path = "../crates/env" }
sbi = { path = "../crates/sbi" }

bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }
fdt = { version = "0.1.5", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "alloc",
  "default-hasher",
] }
log = { version = "0.4.33" }
riscv = { version = "0.16.1", features = ["s-mode"] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
# semihosting = 导宿主文件用的 crate；只开 fs（stdio/panic-handler/time/args 均不需要）。
semihosting = { version = "0.1.25", features = ["fs"] }

[[bin]]
name = "sqware"
path = "src/main.rs"
test = false
bench = false
doctest = false

# 内核内用例的登记与逐例打点（`embedded-test`）。
# `harness = false`：我们不要 libtest，要 embedded-test 自己那套 runner 协议。
[[test]]
name = "embedded"
path = "tests/embedded.rs"
harness = false

[dev-dependencies]
# **dev，不是 dependencies**——这一格是有讲究的：普通构建里 embedded-test 根本不在场，
# 于是 `src/main.rs` 那个 `#[no_mangle] fn main` 与它导出的 `#[export_name = "main"]`
# **永不同框**（测试目标不链 bin：`[[bin]] test = false`）。
#
# `default-features = false`：默认那套带 `panic-handler`，它会定义 `#[panic_handler]`，
# 与内核自己那一个（`runtime::diagnose::halt`）直接撞。取 `semihosting` 是因为
# `embedded-test` 的 `hosting` 模块**必须**有一个传输实现（std / semihosting 二选一）。
embedded-test = { version = "0.7", default-features = false, features = ["semihosting"] }

[lints.cargo]
# 上面那一格 `embedded-test-linker-script` 的用法**这条 lint 看不见**：它不产代码（没有 crate 可
# `use`），承重的是两样东西——上游构建脚本发的 `-L` 搜索路径，以及 `build.rs` 从 registry 源文件
# 读出上游那份 `embedded-test.x` 来复核哈希（见 `build.rs` 头注"哈希自检是故意的"）。
# 删掉它 ⇒ 复核那一路**静默跳过**（`upstream_source()` 答 `None`），两份脚本又能悄悄漂移。
# 故在此声明一次，而不是删一格承重的依赖。
unused_dependencies = "allow"

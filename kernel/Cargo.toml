[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
default = []
# diagnose 结构化记录经 semihosting fs 导出宿主文件（JSON Lines，自描述长度；文件
# sqware-diagnose.jsonl 落在 qemu CWD，runner 归档）。**非默认**（`default = []`，
# 要开须显式 `--features semihosting`）——旧注写「默认开启（default 引入）」与
# manifest 相反。另注意 qemu 侧的 `-semihosting` 只在 `QEMU_SEMI=1` / `QEMU_FEATURES`
# 含 semihosting 时才加（`scripts/boot.nu`，**只管 QEMU 侧**），而 `scripts/examine.nu`
# 的两档都不带头文件 feature ⇒ 门跑过的产物没有结构化导出。
semihosting = []
# 审计框架（fence 的 banker/ledger/audit + 关机类别记账检查）——**cargo feature 门控**：
# **非默认**（不在 default 里）；需显式 `--features audit` 开启。审计不依赖
# debug_assertions 硬化开关，release 也能跑审计。默认关闭以减小常驻 footprint：
# 活块账本（hashbrown）、关机类别记账检查、canary 现场清查等全部 cfg out。
audit = []
# 内核内测试框架（framework/ + health/ 的用例 + link.ld 的 `.tests` 段）。
# **非默认、且不在任何别的档里**：它同时管两件事 —— 启用用例（`.tests` 段登记）与把
# panic 通道改成"报哪一例失败再停机"（`halt.rs`）。两件事拆成两个 feature 只会造出
# 无意义的四象限（登记了却走崩溃转储 / 没登记却报用例失败）。
framework = []

[dependencies]
env = { path = "../crates/env" }
sbi = { path = "../crates/sbi" }
stanza = "0.5.2"

bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }
fdt = { version = "0.1.5", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = [
  "alloc",
  "default-hasher",
] }
log = { version = "0.4.33" }
riscv = { version = "0.16.1", features = ["s-mode"] }
riscv-rt = { version = "0.18.0", features = ["s-mode"] }
# 符号名 demangle（scene 转储打印）：v0/legacy 全语法、流式零分配（panic 现场
# 零分配纪律）、非 Rust 符号原样透传。default-features=false → 纯 no_std。
rustc-demangle = { version = "0.1.28", default-features = false }
# 诊断报告序列化（整档 + 事件流）：serde_json 承担 JSON，derive 即形状、零手写序列化器。
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# semihosting = 导宿主文件用的 crate；只开 fs（stdio/panic-handler/time/args 均不需要）。
semihosting = { version = "0.1.25", features = ["fs"] }

[[bin]]
name = "sqware"
path = "src/main.rs"
test = false
bench = false
doctest = false

[package]
name = "harness"
version.workspace = true
edition.workspace = true

# 测具（**不是**产品）：探针（只读数）· 试客（量服务）· 压测台（整台替换引导镜像）——
# 一句话：**不进产品镜像的一切**。
#
# # 为什么单开一个 crate（用户裁定）
#
#   探针（**只读数**，`probe-*`）：进**验收镜像**当客人跑——`soak` / `examine` 的判据
#                                就是它们打出来的那几行，故它们**必须**在产品的清单里。
#   试客（`guest` / `passer` / `lodger` / `sleeper` / `subject` / `member`）：**进验收镜像当
#                                 客人跑**，量的是服务（身份 / 盟籍 / 时钟 / 树 / 生死账）。
#   压测台（`rig` / `load` / `beat` / `again` / `group` 与它们的受害者 `churn` / `hang` / `park` /
#                               `busy` / `waiter`）：**整台替换引导镜像**，与验收场景没有交集。
#
# 清单按场景拆成几张表（验收那张含探针、台子那张只含台主与它要的受害者）——今天这张表
# 只有一处，就是
# `programs/src/unit/catalog.rs` 的 `PROGRAMS`（每行的 `space` 与 `wanted_by`）。
#
# # 与 `programs` 的关系
#
# **只借它那一件共享入口**：每个程序一声 `extern crate programs;`，把 `programs::entry` 的
# `_start`（`global_asm!`）与 panic 处理拉进链接。链接脚本与产品同一张
# （`programs/link.ld`：镜像都链在 `IMAGE_BASE = 0x10000`）。
#
# 特权级仍**只在 `programs/src/unit/catalog.rs` 的 `PROGRAMS` 声明**（每行的 `space`；与产品同一条规矩）。

# 与 `programs` 同一条：目标 `riscv64gc-unknown-none-elf` 上**编不出 libtest**（它依赖 std），
# 故 4 个测试/基准目标一律关掉——否则 `cargo check --workspace --all-targets` 会去编它。
[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
# `#[entry]`：同上（22 台测具与产品那 6 条共用这一手）。
mold = { path = "../crates/mold" }
# 程序侧用例那一台（搬出去之后仍从这里转出去，见 `src/lib.rs`）。
env = { path = "../crates/env" }
runtime = { path = "../crates/runtime" }
protocol = { path = "../crates/protocol" }
# **共享入口**：`programs::entry` 的 `_start` 与 panic 处理——每个测具一声
# `extern crate programs;` 就是为它（与 `programs` 自己的 bin 同一句话）。
programs = { path = "../programs" }
# 错误容器：压测台把内核负码包成 `erra::Error<EnvError>`（与 `programs` 同款）。
erra = { version = "0.2.0", default-features = false }

[[bin]]
name = "prog-probe-lease"
path = "src/probe/probe_lease.rs"
test = false
bench = false
doctest = false

# ── 那二十三个 bin 的清单 ───────────────────────────────────────────
#
# 特权级**不在这里**声明（与产品同一条规矩）：那一格在 `programs/src/unit/catalog.rs` 的 `PROGRAMS` 里
# （`ProgramKind::User` / `Supervisor`），而且**按场景分**（看每行的 `scenes`）——验收那张只列
# 探针，台子那张只列台主与它要的受害者。

[[bin]]
name = "prog-probe-owner"
path = "src/probe/probe_owner.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-denied"
path = "src/probe/probe_denied.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-bound"
path = "src/probe/probe_bound.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-control"
path = "src/probe/probe_control.rs"
test = false
bench = false
doctest = false

# ── 操作面那一族（`/sys/operator/{part,land,…}`）─────────────────────
#
# 两台一对，**各只开一条会话**：一位客人一条会话是本仓既有的形状（`reply_of` 的认领键是
# "谁开的 ＋ 树路记号"，一位只认最后一枚），故"全操作面"与"只有 land 一位"这**两柄权**要
# 两位客人各持一条——`gate` 那位走控制面（`operator::BERTH`），替 `land` 那位把试验场铺好。
[[bin]]
name = "prog-probe-operator-gate"
path = "src/probe/probe_operator_gate.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-operator-land"
path = "src/probe/probe_operator_land.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-rule"
path = "src/probe/probe_rule.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-probe-rule-other"
path = "src/probe/probe_rule_other.rs"
test = false
bench = false
doctest = false

# ── 试客（**进验收镜像当客人跑**，量的是服务）─────────────────────────────
#
# **它们是第二批搬来的**：第一批搬的是探针与压测台，这六位留在 `programs/src/user/`
# 与产品程序同住一间——而它们早就符合本 crate 的定义（**只为了量**；去掉机器照转，产品镜像
# 实测过）。用户裁定 **甲**：搬过来。于是边界变成一句话——`programs/` = 产品镜像那 6 条，
# 本 crate = 不进产品镜像的一切。
[[bin]]
name = "prog-guest"
path = "src/guest/guest.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "prog-passer"
path = "src/guest/passer.rs"
test = false
bench = false
doctest = false

# 房客（U 态，同 `passer` 一档）：占一条线、**直接死**——线路由者那本账的探活读数。
[[bin]]
